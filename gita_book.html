<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Bhagavad Gita — Sacred Book</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Lato:ital,wght@0,300;0,400;1,300&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;
  background:#e8d9b0;
  font-family:'Lato',sans-serif;
  overflow:hidden;
}

/* =========== WARM BACKGROUND =========== */
.bg{
  position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 60% 40%, #f5e6b8 0%, #d4b870 40%, #b8953a 100%);
}
/* Subtle mandala watermark */
.bg::before{
  content:'ॐ';
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:55vmin;
  color:rgba(139,100,30,.07);
  font-family:'Cinzel',serif;
  pointer-events:none;
  user-select:none;
}
/* Decorative leaf corners */
.leaf-tl,.leaf-tr,.leaf-bl,.leaf-br{
  position:fixed;z-index:1;pointer-events:none;
  font-size:clamp(3rem,8vw,7rem);
  opacity:.35;
  filter:saturate(0.7);
}
.leaf-tl{top:-1rem;left:-1rem;transform:rotate(0deg)}
.leaf-tr{top:-1rem;right:-1rem;transform:rotate(90deg)}
.leaf-bl{bottom:-1rem;left:-1rem;transform:rotate(270deg)}
.leaf-br{bottom:-1rem;right:-1rem;transform:rotate(180deg)}

/* =========== MAIN APP =========== */
.app{
  position:relative;z-index:2;
  height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:.8rem;
  padding:.5rem;
}

/* =========== COVER SCREEN =========== */
#coverScreen{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 60% 40%, #f5e6b8 0%, #d4b870 40%, #b8953a 100%);
  transition:opacity .8s ease;
}
#coverScreen.hide{opacity:0;pointer-events:none}

.book-cover{
  position:relative;
  width:min(320px,80vw);
  height:min(460px,82vh);
  cursor:pointer;
  transition:transform .4s ease, box-shadow .4s ease;
  filter:drop-shadow(0 25px 40px rgba(0,0,0,.5));
}
.book-cover:hover{transform:scale(1.03) translateY(-5px);}

/* Brown spine on left */
.cover-spine{
  position:absolute;
  left:0;top:0;bottom:0;
  width:22px;
  background:linear-gradient(to right,#1a0800,#3d1600,#2d1000);
  border-radius:3px 0 0 3px;
  z-index:3;
  box-shadow:inset -3px 0 6px rgba(0,0,0,.4);
}
.cover-spine::after{
  content:'';
  position:absolute;left:7px;top:8%;bottom:8%;
  width:2px;
  background:linear-gradient(to bottom,transparent,rgba(180,120,30,.5),transparent);
}

/* Front cover */
.cover-front{
  position:absolute;
  left:22px;right:0;top:0;bottom:0;
  overflow:hidden;
  border-radius:0 6px 6px 0;
  border:3px solid #8b6a1a;
  border-left:none;
}
.cover-front img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center 8%; /* Shows Krishna & Arjuna faces */
}
/* Golden gradient bottom overlay */
.cover-front::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(20,8,0,0) 0%,
    rgba(20,8,0,0) 45%,
    rgba(10,4,0,.65) 75%,
    rgba(10,4,0,.9) 100%
  );
}
/* Golden ornamental border inside */
.cover-border{
  position:absolute;inset:8px;
  border:2px solid rgba(200,160,40,.7);
  border-radius:2px;
  z-index:2;
  pointer-events:none;
  box-shadow:inset 0 0 15px rgba(200,160,40,.1);
}
/* Cover text */
.cover-text{
  position:absolute;bottom:0;left:0;right:0;
  z-index:3;
  text-align:center;
  padding:1rem .8rem 1.5rem;
}
.cover-small{
  font-family:'Cinzel',serif;
  font-size:clamp(.55rem,1.5vw,.75rem);
  color:rgba(255,210,80,.8);
  letter-spacing:3px;
  text-transform:lowercase;
  margin-bottom:.2rem;
}
.cover-big{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.3rem,4vw,2rem);
  color:#ffe080;
  text-shadow:0 2px 12px rgba(0,0,0,.8);
  line-height:1.2;
}
.cover-devanagari{
  font-family:'Noto Sans Devanagari',sans-serif;
  font-size:.75rem;
  color:rgba(255,210,80,.65);
  margin-top:.3rem;
  letter-spacing:1px;
}

/* Pages edge (right) */
.cover-pages{
  position:absolute;
  right:-14px;top:4px;bottom:4px;
  width:14px;
  background:repeating-linear-gradient(
    to bottom,
    #f5e8c0,#efe0b0 1px,#e8d499 2px
  );
  border-radius:0 3px 3px 0;
  border:1px solid rgba(139,100,30,.4);
  border-left:none;
  box-shadow:4px 0 8px rgba(0,0,0,.25);
}

/* Start button below cover */
.cover-start-btn{
  display:block;
  margin-top:1.2rem;
  background:linear-gradient(135deg,#5c2d00,#9a5000,#5c2d00);
  color:#ffd060;
  border:2px solid rgba(200,150,40,.5);
  padding:.75rem 2.5rem;
  border-radius:4px;
  font-family:'Cinzel',serif;
  font-size:.9rem;
  letter-spacing:3px;
  cursor:pointer;
  text-transform:uppercase;
  transition:all .3s;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}
.cover-start-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  background:linear-gradient(135deg,#7a3800,#c06000,#7a3800);
}

/* =========== BOOK SCREEN =========== */
#bookScreen{
  display:none;
  position:fixed;inset:0;z-index:40;
  flex-direction:column;
  align-items:center;justify-content:center;
  gap:.6rem;
  padding:.4rem;
}
#bookScreen.show{display:flex}

/* ---- TOP BAR ---- */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:900px;
  padding:.3rem .5rem;
}
.tb-logo{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(.7rem,1.5vw,.9rem);
  color:#5c2d00;
  letter-spacing:2px;
}
.tb-info{
  font-family:'Cinzel',serif;
  font-size:clamp(.6rem,1.2vw,.75rem);
  color:#7a4a10;
  letter-spacing:1px;
  text-align:center;
}
.tb-close{
  background:linear-gradient(135deg,#5c2d00,#8b4500);
  color:#ffd060;
  border:1px solid rgba(200,150,40,.4);
  padding:.35rem .9rem;
  border-radius:20px;
  cursor:pointer;
  font-family:'Cinzel',serif;
  font-size:.7rem;
  letter-spacing:1px;
  transition:all .25s;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}
.tb-close:hover{background:linear-gradient(135deg,#7a3800,#b05500);transform:translateY(-1px)}

/* ---- BOOK SPREAD ---- */
.book-spread-wrap{
  display:flex;
  align-items:center;
  gap:1rem;
  width:100%;
  max-width:940px;
  flex:1;
  min-height:0;
}

/* Arrow nav buttons */
.arrow-btn{
  width:clamp(38px,5vw,52px);
  height:clamp(38px,5vw,52px);
  border-radius:50%;
  background:rgba(255,255,255,.55);
  border:2px solid rgba(139,100,30,.3);
  color:#5c2d00;
  font-size:clamp(1rem,2vw,1.4rem);
  cursor:pointer;
  flex-shrink:0;
  transition:all .25s;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
  backdrop-filter:blur(4px);
}
.arrow-btn:hover:not(:disabled){
  background:rgba(255,255,255,.85);
  transform:scale(1.1);
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.arrow-btn:disabled{opacity:.25;cursor:default;transform:none}

/* The open book */
.open-book{
  flex:1;
  height:100%;
  max-height:min(500px,75vh);
  display:flex;
  border-radius:4px;
  overflow:visible;
  position:relative;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.35));
}

/* Left page */
.page-left,.page-right{
  flex:1;
  background:#fdf5df;
  padding:clamp(.8rem,2vw,1.5rem);
  display:flex;flex-direction:column;
  gap:.5rem;
  position:relative;
  overflow:hidden;
}
.page-left{
  border-radius:4px 0 0 4px;
  border:2px solid #b8953a;
  border-right:none;
  background:linear-gradient(to right,#faecd5,#fdf5df);
}
.page-right{
  border-radius:0 4px 4px 0;
  border:2px solid #b8953a;
  border-left:none;
  background:linear-gradient(to left,#faecd5,#fdf5df);
}
/* Center spine shadow */
.page-left::after{
  content:'';
  position:absolute;right:0;top:5%;bottom:5%;
  width:12px;
  background:linear-gradient(to left,rgba(100,60,10,.18),transparent);
  pointer-events:none;
}
.page-right::before{
  content:'';
  position:absolute;left:0;top:5%;bottom:5%;
  width:12px;
  background:linear-gradient(to right,rgba(100,60,10,.18),transparent);
  pointer-events:none;
}

/* Golden ornate border on each page */
.page-border{
  position:absolute;inset:6px;
  border:1.5px solid rgba(180,140,30,.5);
  border-radius:2px;
  pointer-events:none;
  z-index:0;
}
/* Corner ornaments */
.page-border::before,.page-border::after{
  content:'✦';
  position:absolute;
  color:rgba(180,140,30,.6);
  font-size:.7rem;
}
.page-border::before{top:-8px;left:-8px}
.page-border::after{bottom:-8px;right:-8px}

/* Page content */
.page-content{
  position:relative;z-index:1;
  height:100%;
  display:flex;flex-direction:column;
  gap:.5rem;
  overflow:hidden;
}

.pg-header{
  text-align:center;
  border-bottom:1px solid rgba(180,140,30,.3);
  padding-bottom:.4rem;
  flex-shrink:0;
}
.pg-header-icon{font-size:.8rem;color:rgba(180,140,30,.7)}
.pg-chapter-label{
  font-family:'Cinzel',serif;
  font-size:clamp(.6rem,1.2vw,.75rem);
  color:#7a4a10;
  letter-spacing:2px;
  text-transform:uppercase;
}
.pg-verse-label{
  font-family:'Cinzel',serif;
  font-size:clamp(.55rem,1vw,.65rem);
  color:#a07030;
  letter-spacing:1px;
}

.pg-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding-right:2px}
.pg-body::-webkit-scrollbar{width:3px}
.pg-body::-webkit-scrollbar-thumb{background:rgba(180,140,30,.3);border-radius:2px}

.pg-section-label{
  font-family:'Cinzel',serif;
  font-size:clamp(.55rem,1vw,.65rem);
  color:#7a4a10;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-top:.2rem;
  flex-shrink:0;
}

/* Sanskrit text */
.pg-sanskrit{
  font-family:'Noto Sans Devanagari',sans-serif;
  font-size:clamp(.82rem,1.6vw,1rem);
  color:#3d1a00;
  line-height:2;
  text-align:center;
}
.pg-translit{
  font-size:clamp(.62rem,1.1vw,.72rem);
  color:#8b6432;
  font-style:italic;
  line-height:1.7;
  text-align:center;
  border-top:1px dashed rgba(180,140,30,.25);
  padding-top:.3rem;
}

/* English text */
.pg-meaning-label{
  font-family:'Cinzel',serif;
  font-size:clamp(.55rem,1vw,.65rem);
  color:#7a4a10;
  letter-spacing:1px;
  text-align:center;
}
.pg-english{
  font-size:clamp(.75rem,1.4vw,.88rem);
  color:#2d1000;
  line-height:1.85;
  font-style:italic;
  text-align:center;
}

/* Chapter title page (both pages together) */
.ch-title-page{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;gap:.6rem;height:100%;
}
.ctp-num{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(2rem,6vw,4rem);
  color:rgba(139,100,30,.15);
  line-height:1;
}
.ctp-tag{
  font-family:'Cinzel',serif;
  font-size:clamp(.55rem,1vw,.68rem);
  color:#a07030;letter-spacing:3px;
  text-transform:uppercase;
}
.ctp-divider{
  width:50px;height:1.5px;
  background:linear-gradient(to right,transparent,#b8953a,transparent);
}
.ctp-title{
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(.9rem,2.2vw,1.3rem);
  color:#5c2d00;line-height:1.4;
}
.ctp-subtitle{
  font-family:'Cinzel',serif;
  font-size:clamp(.65rem,1.3vw,.8rem);
  color:#8b6432;font-style:italic;
  max-width:260px;
}

/* Index page */
.index-page{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.3rem .8rem;
  height:100%;
  overflow-y:auto;
  padding:.3rem;
}
.index-page::-webkit-scrollbar{width:3px}
.index-item{cursor:pointer;padding:.25rem .4rem;border-radius:3px;transition:background .2s}
.index-item:hover{background:rgba(180,140,30,.15)}
.idx-num{font-family:'Cinzel',serif;font-size:.58rem;color:#a07030;margin-bottom:.05rem}
.idx-title{font-family:'Cinzel',serif;font-size:.62rem;color:#5c2d00;line-height:1.3;font-weight:600}
.idx-sub{font-size:.55rem;color:#8b6432;line-height:1.3;font-style:italic}

/* ---- BOTTOM BUTTONS ---- */
.bottom-bar{
  display:flex;align-items:center;justify-content:center;
  gap:.6rem;
  width:100%;max-width:900px;
  padding:.2rem .5rem;
  flex-shrink:0;
  flex-wrap:wrap;
}
.bb-btn{
  padding:.5rem 1.2rem;
  border-radius:4px;border:none;
  font-family:'Cinzel',serif;
  font-size:clamp(.65rem,1.3vw,.8rem);
  letter-spacing:1px;
  cursor:pointer;
  transition:all .3s;
  min-width:100px;
}
.bb-prev,.bb-next{
  background:linear-gradient(135deg,#5c2d00,#8b4500);
  color:#ffd060;
  border:1px solid rgba(200,150,40,.3);
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.bb-prev:hover:not(:disabled),.bb-next:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(0,0,0,.3);
  background:linear-gradient(135deg,#7a3800,#b05500);
}
.bb-prev:disabled,.bb-next:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none}

.bb-sanskrit{
  background:linear-gradient(135deg,#2d1060,#5c2d9e);
  color:#d4a8ff;
  border:1px solid rgba(180,100,255,.3);
  box-shadow:0 4px 12px rgba(60,20,100,.3);
}
.bb-sanskrit:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(80,30,160,.4);
  background:linear-gradient(135deg,#3d1880,#7a3dc8);
}
.bb-english{
  background:linear-gradient(135deg,#0a2040,#1a4a80);
  color:#a8d4ff;
  border:1px solid rgba(100,180,255,.3);
  box-shadow:0 4px 12px rgba(20,60,120,.3);
}
.bb-english:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(30,80,180,.4);
  background:linear-gradient(135deg,#162d55,#2560a8);
}
.bb-sanskrit:disabled,.bb-english:disabled{opacity:.3;cursor:default;transform:none;box-shadow:none}

.bb-center{
  font-family:'Cinzel',serif;
  font-size:clamp(.58rem,1.1vw,.7rem);
  color:#7a4a10;
  text-align:center;
  min-width:110px;
  line-height:1.5;
}

/* Speaking dot */
.sdot{
  display:inline-block;width:6px;height:6px;
  background:currentColor;border-radius:50%;
  animation:sdotPulse .7s ease-in-out infinite;
  margin-left:4px;vertical-align:middle;
}
@keyframes sdotPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.7);opacity:.4}}

/* Page flip animation */
@keyframes pgIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.pg-flip{animation:pgIn .3s ease both}

/* Toast */
.toast{
  position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);
  background:rgba(60,20,0,.95);border:1px solid rgba(180,130,30,.5);
  color:#ffd060;padding:.45rem 1.2rem;border-radius:20px;
  font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:1px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;
  white-space:nowrap;
}
.toast.show{opacity:1}

@media(max-width:600px){
  .book-spread-wrap{gap:.4rem}
  .pg-chapter-label{display:none}
  .bottom-bar{gap:.35rem}
  .bb-btn{min-width:72px;padding:.45rem .7rem;font-size:.62rem}
}
</style>
</head>

<script>
const PAGES = [{"type": "cover"}, {"type": "index"}, {"type": "chapter", "num": 1, "title": "Arjun Vishad Yog", "subtitle": "Lamenting the Consequences of War"}, {"type": "verse", "chnum": 1, "chtitle": "Arjun Vishad Yog", "vnum": "1", "sanskrit": "धृतराष्ट्र उवाच\nधर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः।\nमामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय॥", "tl": "Dhritarashtra uvacha: dharma-ksetre kuru-ksetre samaveta yuyutsavah, mamakah pandavas caiva kim akurvata sanjaya.", "english": "Dhritarashtra said: O Sanjaya, after my sons and the sons of Pandu assembled at the holy land of Kurukshetra, desiring to fight, what did they do?"}, {"type": "verse", "chnum": 1, "chtitle": "Arjun Vishad Yog", "vnum": "11", "sanskrit": "अपर्याप्तं तदस्माकं बलं भीष्माभिरक्षितम्।\nपर्याप्तं त्विदमेतेषां बलं भीमाभिरक्षितम्॥", "tl": "Aparyaptam tad asmakam balam bhismabhiraksitam, paryaptam tv idam etesam balam bhimabhiraksitam.", "english": "Our strength is immeasurable and we are perfectly protected by Grandfather Bhishma, whereas the strength of the Pandavas, carefully protected by Bhima, is limited."}, {"type": "verse", "chnum": 1, "chtitle": "Arjun Vishad Yog", "vnum": "28", "sanskrit": "अर्जुन उवाच\nदृष्ट्वेमं स्वजनं कृष्ण युयुत्सुं समुपस्थितम्।\nसीदन्ति मम गात्राणि मुखं च परिशुष्यति॥", "tl": "Arjuna uvacha: drstvedam sva-janam krsna yuyutsum samupasthitam, sidanti mama gatrani mukham ca parisusyati.", "english": "Arjuna said: My dear Krishna, seeing my friends and relatives present before me with such fighting spirit, I feel the limbs of my body quivering and my mouth drying up."}, {"type": "verse", "chnum": 1, "chtitle": "Arjun Vishad Yog", "vnum": "47", "sanskrit": "सञ्जय उवाच\nएवमुक्त्वार्जुनः सङ्ख्ये रथोपस्थ उपाविशत्।\nविसृज्य सशरं चापं शोकसंविग्नमानसः॥", "tl": "Sanjaya uvacha: evam uktvarjunah sankhye rathopastha upavisat, visrjya sa-saram capam soka-samvigna-manasah.", "english": "Sanjaya said: Arjuna, having thus spoken on the battlefield, cast aside his bow and arrows and sat down on the chariot, his mind overwhelmed with grief."}, {"type": "chapter", "num": 2, "title": "Sankhya Yog", "subtitle": "The Yog of Analytical Knowledge"}, {"type": "verse", "chnum": 2, "chtitle": "Sankhya Yog", "vnum": "11", "sanskrit": "श्रीभगवानुवाच\nअशोच्यानन्वशोचस्त्वं प्रज्ञावादांश्च भाषसे।\nगतासूनगतासूंश्च नानुशोचन्ति पण्डिताः॥", "tl": "Sri-bhagavan uvacha: asocyan anvasocas tvam prajna-vadams ca bhasase, gatasun agatasums ca nanusocanti panditah.", "english": "The Blessed Lord said: While speaking learned words, you are mourning for what is not worthy of grief. Those who are wise lament neither for the living nor for the dead."}, {"type": "verse", "chnum": 2, "chtitle": "Sankhya Yog", "vnum": "14", "sanskrit": "मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः।\nआगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत॥", "tl": "Matra-sparsas tu kaunteya sitosna-sukha-duhkha-dah, agamapayino nityas tams titiksasva bharata.", "english": "O son of Kunti, the temporary appearances of happiness and distress, and their disappearance in due course, are like the appearance of winter and summer seasons. They arise from sense perception, and one must learn to tolerate them without being disturbed."}, {"type": "verse", "chnum": 2, "chtitle": "Sankhya Yog", "vnum": "20", "sanskrit": "न जायते म्रियते वा कदाचिन्\nनायं भूत्वा भविता वा न भूयः।\nअजो नित्यः शाश्वतोऽयं पुराणो\nन हन्यते हन्यमाने शरीरे॥", "tl": "Na jayate mriyate va kadacin nayam bhutva bhavita va na bhuyah, ajo nityah sasvato yam purano na hanyate hanyamane sarire.", "english": "For the soul there is never birth nor death at any time. It has not come into being, does not come into being, and will not come into being. It is unborn, eternal, ever-existing, and primeval. It is not slain when the body is slain."}, {"type": "verse", "chnum": 2, "chtitle": "Sankhya Yog", "vnum": "47", "sanskrit": "कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।\nमा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥", "tl": "Karmany evadhikaras te ma phalesu kadacana, ma karma-phala-hetur bhur ma te sango stv akarmani.", "english": "You have a right to perform your prescribed duties, but you are not entitled to the fruits of your actions. Never consider yourself the cause of the results of your activities, and never be attached to not doing your duty."}, {"type": "verse", "chnum": 2, "chtitle": "Sankhya Yog", "vnum": "62", "sanskrit": "ध्यायतो विषयान्पुंसः सङ्गस्तेषूपजायते।\nसङ्गात्सञ्जायते कामः कामात्क्रोधोऽभिजायते॥", "tl": "Dhyayato visayan pumsah sangas tesupajayate, sangat sanjayate kamah kamat krodho bhijayate.", "english": "While contemplating the objects of the senses, a person develops attachment for them, and from such attachment lust develops, and from lust anger arises."}, {"type": "chapter", "num": 3, "title": "Karm Yog", "subtitle": "The Yog of Action"}, {"type": "verse", "chnum": 3, "chtitle": "Karm Yog", "vnum": "8", "sanskrit": "नियतं कुरु कर्म त्वं कर्म ज्यायो ह्यकर्मणः।\nशरीरयात्रापि च ते न प्रसिद्ध्येदकर्मणः॥", "tl": "Niyatam kuru karma tvam karma jyayo hy akarmanah, sarira-yatrapic ca te na prasiddhyed akarmana.", "english": "Perform your prescribed duty, for action is better than inaction. A man cannot even maintain his physical body without work."}, {"type": "verse", "chnum": 3, "chtitle": "Karm Yog", "vnum": "27", "sanskrit": "प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः।\nअहङ्कारविमूढात्मा कर्ताहमिति मन्यते॥", "tl": "Prakrteh kriyamanani gunaih karmani sarvasah, ahankara-vimudhatma kartaham iti manyate.", "english": "The spirit soul bewildered by the influence of false ego thinks himself the doer of activities that are in actuality carried out by the three modes of material nature."}, {"type": "verse", "chnum": 3, "chtitle": "Karm Yog", "vnum": "35", "sanskrit": "श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।\nस्वधर्मे निधनं श्रेयः परधर्मो भयावहः॥", "tl": "Sreyan sva-dharmo vigunah para-dharmat sv-anusthitat, sva-dharme nidhanam sreyah para-dharmo bhayavahah.", "english": "It is far better to discharge one's prescribed duties, even though faultily, than another's duties perfectly. Destruction in the course of performing one's own duty is better than engaging in another's duties, for to follow another's path is dangerous."}, {"type": "chapter", "num": 4, "title": "Jnana Karm Sanyas Yog", "subtitle": "The Yog of Knowledge and the Disciplines of Action"}, {"type": "verse", "chnum": 4, "chtitle": "Jnana Karm Sanyas Yog", "vnum": "7", "sanskrit": "यदा यदा हि धर्मस्य ग्लानिर्भवति भारत।\nअभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम्॥", "tl": "Yada yada hi dharmasya glanir bhavati bharata, abhyutthanam adharmasya tadatmanam srjamy aham.", "english": "Whenever and wherever there is a decline in religious practice, O descendant of Bharata, and a predominant rise of irreligion — at that time I descend Myself."}, {"type": "verse", "chnum": 4, "chtitle": "Jnana Karm Sanyas Yog", "vnum": "8", "sanskrit": "परित्राणाय साधूनां विनाशाय च दुष्कृताम्।\nधर्मसंस्थापनार्थाय सम्भवामि युगे युगे॥", "tl": "Paritranaya sadhunam vinasaya ca duskrtam, dharma-samsthapanarthaya sambhavami yuge yuge.", "english": "To deliver the pious and to annihilate the miscreants, as well as to reestablish the principles of religion, I Myself appear, millennium after millennium."}, {"type": "verse", "chnum": 4, "chtitle": "Jnana Karm Sanyas Yog", "vnum": "34", "sanskrit": "तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया।\nउपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः॥", "tl": "Tad viddhi pranipatena pariprasnena sevaya, upadeksyanti te jnanam jnaninas tattva-darsinah.", "english": "Just try to learn the truth by approaching a spiritual master. Inquire from him submissively and render service unto him. The self-realized souls can impart knowledge unto you because they have seen the truth."}, {"type": "chapter", "num": 5, "title": "Karm Sanyas Yog", "subtitle": "The Yog of Renunciation"}, {"type": "verse", "chnum": 5, "chtitle": "Karm Sanyas Yog", "vnum": "18", "sanskrit": "विद्याविनयसम्पन्ने ब्राह्मणे गवि हस्तिनि।\nशुनि चैव श्वपाके च पण्डिताः समदर्शिनः॥", "tl": "Vidya-vinaya-sampanne brahmane gavi hastini, suni caiva sva-pake ca panditah sama-darsinah.", "english": "The humble sages, by virtue of true knowledge, see with equal vision a learned brahmana, a cow, an elephant, a dog and a dog-eater."}, {"type": "verse", "chnum": 5, "chtitle": "Karm Sanyas Yog", "vnum": "29", "sanskrit": "भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम्।\nसुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति॥", "tl": "Bhoktaram yajna-tapasam sarva-loka-mahesvaram, suhrdam sarva-bhutanam jnatva mam santim rcchati.", "english": "A person in full consciousness of Me, knowing Me to be the ultimate beneficiary of all sacrifices, the Supreme Lord of all planets, and the benefactor of all living entities, attains peace from the pangs of material miseries."}, {"type": "chapter", "num": 6, "title": "Dhyan Yog", "subtitle": "The Yog of Meditation"}, {"type": "verse", "chnum": 6, "chtitle": "Dhyan Yog", "vnum": "5", "sanskrit": "उद्धरेदात्मनात्मानं नात्मानमवसादयेत्।\nआत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः॥", "tl": "Uddhared atmanatmanam natmanam avasadayet, atmaiva hy atmano bandhur atmaiva ripur atmanah.", "english": "One must deliver himself with the help of his mind, and not degrade himself. The mind is the friend of the conditioned soul, and his enemy as well."}, {"type": "verse", "chnum": 6, "chtitle": "Dhyan Yog", "vnum": "19", "sanskrit": "यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता।\nयोगिनो यतचित्तस्य युञ्जतो योगमात्मनः॥", "tl": "Yatha dipo nivata-stho nengate sopama smrta, yogino yata-cittasya yunjato yogam atmanah.", "english": "As a lamp in a windless place does not waver, so the transcendentalist, whose mind is controlled, remains always steady in his meditation on the transcendent self."}, {"type": "verse", "chnum": 6, "chtitle": "Dhyan Yog", "vnum": "34", "sanskrit": "चञ्चलं हि मनः कृष्ण प्रमाथि बलवद्दृढम्।\nतस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम्॥", "tl": "Cancalam hi manah krsna pramathi balavad drdham, tasyaham nigraham manye vayor iva su-duskaram.", "english": "For the mind is restless, turbulent, obstinate and very strong, O Krishna, and to subdue it, I think, is more difficult than controlling the wind."}, {"type": "chapter", "num": 7, "title": "Jnana Vijnana Yog", "subtitle": "The Yog of Analytical Knowledge"}, {"type": "verse", "chnum": 7, "chtitle": "Jnana Vijnana Yog", "vnum": "8", "sanskrit": "रसोऽहमप्सु कौन्तेय प्रभास्मि शशिसूर्ययोः।\nप्रणवः सर्ववेदेषु शब्दः खे पौरुषं नृषु॥", "tl": "Raso ham apsu kaunteya prabhasmi sasi-suryayoh, pranavah sarva-vedesu sabdah khe paurusam nrsu.", "english": "O son of Kunti, I am the taste of water, the light of the sun and the moon, the syllable om in the Vedic mantras; I am the sound in ether and ability in man."}, {"type": "verse", "chnum": 7, "chtitle": "Jnana Vijnana Yog", "vnum": "19", "sanskrit": "बहूनां जन्मनामन्ते ज्ञानवान्मां प्रपद्यते।\nवासुदेवः सर्वमिति स महात्मा सुदुर्लभः॥", "tl": "Bahunam janmanam ante jnanavan mam prapadyate, vasudevah sarvam iti sa mahatma su-durlabhah.", "english": "After many births and deaths, he who is actually in knowledge surrenders unto Me, knowing Me to be the cause of all causes and all that is. Such a great soul is very rare."}, {"type": "chapter", "num": 8, "title": "Akshar Brahma Yog", "subtitle": "The Yog of the Eternal God"}, {"type": "verse", "chnum": 8, "chtitle": "Akshar Brahma Yog", "vnum": "5", "sanskrit": "अन्तकाले च मामेव स्मरन्मुक्त्वा कलेवरम्।\nयः प्रयाति स मद्भावं याति नास्त्यत्र संशयः॥", "tl": "Anta-kale ca mam eva smaran muktva kalevaram, yah prayati sa mad-bhavam yati nasty atra samsayah.", "english": "And whoever, at the end of his life, quits his body remembering Me alone at once attains My nature. Of this there is no doubt."}, {"type": "verse", "chnum": 8, "chtitle": "Akshar Brahma Yog", "vnum": "7", "sanskrit": "तस्मात्सर्वेषु कालेषु मामनुस्मर युध्य च।\nमय्यर्पितमनोबुद्धिर्मामेवैष्यस्यसंशयः॥", "tl": "Tasmat sarvesu kalesu mam anusmara yudhya ca, mayy arpita-mano-buddhir mam evaisyasy asamsayah.", "english": "Therefore, Arjuna, you should always think of Me and at the same time carry out your duty of fighting. With your mind and intelligence fixed on Me, you will attain Me without doubt."}, {"type": "chapter", "num": 9, "title": "Raja Vidya Yog", "subtitle": "The Yog through the King of Sciences"}, {"type": "verse", "chnum": 9, "chtitle": "Raja Vidya Yog", "vnum": "22", "sanskrit": "अनन्याश्चिन्तयन्तो मां ये जनाः पर्युपासते।\nतेषां नित्याभियुक्तानां योगक्षेमं वहाम्यहम्॥", "tl": "Ananya as cintayanto mam ye janah paryupasate, tesam nityabhiyuktanam yoga-ksemam vahamy aham.", "english": "But those who always worship Me with exclusive devotion, meditating on My transcendental form — to them, I carry what they lack, and I preserve what they have."}, {"type": "verse", "chnum": 9, "chtitle": "Raja Vidya Yog", "vnum": "27", "sanskrit": "यत्करोषि यदश्नासि यज्जुहोषि ददासि यत्।\nयत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम्॥", "tl": "Yat karosi yad asnasi yaj juhosi dadasi yat, yat tapasyasi kaunteya tat kurusva mad-arpanam.", "english": "O son of Kunti, all that you do, all that you eat, all that you offer and give away, as well as all austerities that you may perform, should be done as an offering unto Me."}, {"type": "chapter", "num": 10, "title": "Vibhuti Yog", "subtitle": "The Yog through Appreciating the Infinite Opulences of God"}, {"type": "verse", "chnum": 10, "chtitle": "Vibhuti Yog", "vnum": "20", "sanskrit": "अहमात्मा गुडाकेश सर्वभूताशयस्थितः।\nअहमादिश्च मध्यं च भूतानामन्त एव च॥", "tl": "Aham atma gudakesa sarva-bhutasaya-sthitah, aham adis ca madhyam ca bhutanam anta eva ca.", "english": "I am the Self, O Gudakesa, seated in the hearts of all creatures. I am the beginning, the middle and the end of all beings."}, {"type": "verse", "chnum": 10, "chtitle": "Vibhuti Yog", "vnum": "41", "sanskrit": "यद्यद्विभूतिमत्सत्त्वं श्रीमदूर्जितमेव वा।\nतत्तदेवावगच्छ त्वं मम तेजोंऽशसम्भवम्॥", "tl": "Yad yad vibhutimat sattvam srimad urjitam eva va, tat tad evavagaccha tvam mama tejo-msa-sambhavam.", "english": "Know that all opulent, beautiful and glorious creations spring from but a spark of My splendor."}, {"type": "chapter", "num": 11, "title": "Vishwarup Darshan Yog", "subtitle": "The Yog through Beholding the Cosmic Form of God"}, {"type": "verse", "chnum": 11, "chtitle": "Vishwarup Darshan Yog", "vnum": "32", "sanskrit": "श्रीभगवानुवाच\nकालोऽस्मि लोकक्षयकृत्प्रवृद्धो\nलोकान्समाहर्तुमिह प्रवृत्तः।\nऋतेऽपि त्वां न भविष्यन्ति सर्वे\nयेऽवस्थिताः प्रत्यनीकेषु योधाः॥", "tl": "Sri-bhagavan uvacha: kalo smi loka-ksaya-krt pravrddho lokan samaharttum iha pravrttah, rte pi tvam na bhavisyanti sarve ye vasthitah pratyanikeshu yodhah.", "english": "The Blessed Lord said: Time I am, the great destroyer of the worlds, and I have come here to destroy all people. With the exception of you, all the soldiers here on both sides will be slain."}, {"type": "chapter", "num": 12, "title": "Bhakti Yog", "subtitle": "The Yog of Devotion"}, {"type": "verse", "chnum": 12, "chtitle": "Bhakti Yog", "vnum": "8", "sanskrit": "मय्येव मन आधत्स्व मयि बुद्धिं निवेशय।\nनिवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः॥", "tl": "Mayy eva mana adhatsva mayi buddhim nivesaya, nivasisyasi mayy eva ata urdhvam na samsayah.", "english": "Just fix your mind upon Me, the Supreme Personality of Godhead, and engage all your intelligence in Me. Thus you will live in Me always, without a doubt."}, {"type": "verse", "chnum": 12, "chtitle": "Bhakti Yog", "vnum": "13", "sanskrit": "अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च।\nनिर्ममो निरहङ्कारः समदुःखसुखः क्षमी॥", "tl": "Advesta sarva-bhutanam maitrah karuna eva ca, nirmamo nirahankarah sama-duhkha-sukhah ksami.", "english": "One who is not envious but is a kind friend to all living entities, who does not think himself a proprietor, who is free from false ego, equal in happiness and distress, and is forgiving — such a devotee is very dear to Me."}, {"type": "chapter", "num": 13, "title": "Kshetra Kshetrajna Vibhag Yog", "subtitle": "The Yog through Distinguishing the Field and the Knower of the Field"}, {"type": "verse", "chnum": 13, "chtitle": "Kshetra Kshetrajna Vibhag Yog", "vnum": "2", "sanskrit": "क्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु भारत।\nक्षेत्रक्षेत्रज्ञयोर्ज्ञानं यत्तज्ज्ञानं मतं मम॥", "tl": "Ksetra-jnam capi mam viddhi sarva-ksetresu bharata, ksetra-ksetrajnayor jnanam yat taj jnanam matam mama.", "english": "O scion of Bharata, you should understand that I am also the knower in all bodies, and to understand this body and its owner is called knowledge. That is My opinion."}, {"type": "chapter", "num": 14, "title": "Guna Traya Vibhag Yog", "subtitle": "The Yog through Understanding the Three Modes of Material Nature"}, {"type": "verse", "chnum": 14, "chtitle": "Guna Traya Vibhag Yog", "vnum": "1", "sanskrit": "श्रीभगवानुवाच\nपरं भूयः प्रवक्ष्यामि ज्ञानानां ज्ञानमुत्तमम्।\nयज्ज्ञात्वा मुनयः सर्वे परां सिद्धिमितो गताः॥", "tl": "Sri-bhagavan uvacha: param bhuyah pravaksyami jnananam jnanam uttamam, yaj jnatva munayah sarve param siddhim ito gatah.", "english": "The Blessed Lord said: Again I shall declare to thee that supreme knowledge, the best of all knowledge, having known which all the sages have gone hence to the highest perfection."}, {"type": "verse", "chnum": 14, "chtitle": "Guna Traya Vibhag Yog", "vnum": "5", "sanskrit": "सत्त्वं रजस्तम इति गुणाः प्रकृतिसम्भवाः।\nनिबध्नन्ति महाबाहो देहे देहिनमव्ययम्॥", "tl": "Sattvam rajas tama iti gunah prakrti-sambhavah, nibadhnanti maha-baho dehe dehinam avyayam.", "english": "Material nature consists of three modes — goodness, passion and ignorance. When the eternal living entity comes in contact with nature, O mighty-armed Arjuna, he becomes conditioned by these modes."}, {"type": "chapter", "num": 15, "title": "Purushottam Yog", "subtitle": "The Yog of the Supreme Divine Personality"}, {"type": "verse", "chnum": 15, "chtitle": "Purushottam Yog", "vnum": "15", "sanskrit": "सर्वस्य चाहं हृदि सन्निविष्टो\nमत्तः स्मृतिर्ज्ञानमपोहनं च।\nवेदैश्च सर्वैरहमेव वेद्यो\nवेदान्तकृद्वेदविदेव चाहम्॥", "tl": "Sarvasya caham hrdi sannivisto mattah smrtir jnanam apohanam ca, vedais ca sarvair aham eva vedyo vedanta-krd veda-vid eva caham.", "english": "I am seated in everyone's heart, and from Me come remembrance, knowledge and forgetfulness. By all the Vedas, I am to be known. Indeed, I am the compiler of Vedanta, and I am the knower of the Vedas."}, {"type": "chapter", "num": 16, "title": "Daivasura Sampad Vibhag Yog", "subtitle": "The Yog through Understanding Divine and Demoniac Nature"}, {"type": "verse", "chnum": 16, "chtitle": "Daivasura Sampad Vibhag Yog", "vnum": "1", "sanskrit": "अभयं सत्त्वसंशुद्धिर्ज्ञानयोगव्यवस्थितिः।\nदानं दमश्च यज्ञश्च स्वाध्यायस्तप आर्जवम्॥", "tl": "Abhayam sattva-samsuddhir jnana-yoga-vyavasthitih, danam damas ca yajnas ca svadhyayas tapa arjavam.", "english": "Fearlessness; purification of one's existence; cultivation of spiritual knowledge; charity; self-control; performance of sacrifice; study of the Vedas; austerity; simplicity — these transcendental qualities belong to those endowed with a divine nature."}, {"type": "chapter", "num": 17, "title": "Shraddhatraya Vibhag Yog", "subtitle": "The Yog through Understanding the Three Types of Faith"}, {"type": "verse", "chnum": 17, "chtitle": "Shraddhatraya Vibhag Yog", "vnum": "3", "sanskrit": "सत्त्वानुरूपा सर्वस्य श्रद्धा भवति भारत।\nश्रद्धामयोऽयं पुरुषो यो यच्छ्रद्धः स एव सः॥", "tl": "Sattvanurupa sarvasya sraddha bhavati bharata, sraddha-mayo yam puruso yo yac-chraddhah sa eva sah.", "english": "O son of Bharata, according to one's existence under the various modes of nature, one evolves a particular kind of faith. The living being is said to be of a particular faith according to the modes he has acquired."}, {"type": "chapter", "num": 18, "title": "Moksha Sanyas Yog", "subtitle": "The Yog through the Perfection of Renunciation and Surrender"}, {"type": "verse", "chnum": 18, "chtitle": "Moksha Sanyas Yog", "vnum": "65", "sanskrit": "मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु।\nमामेवैष्यसि सत्यं ते प्रतिजाने प्रियोऽसि मे॥", "tl": "Man-mana bhava mad-bhakto mad-yaji mam namaskuru, mam evaisyasi satyam te pratijane priyo si me.", "english": "Always think of Me, become My devotee, worship Me and offer your homage unto Me. Thus you will come to Me without fail. I promise you this because you are My very dear friend."}, {"type": "verse", "chnum": 18, "chtitle": "Moksha Sanyas Yog", "vnum": "66", "sanskrit": "सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज।\nअहं त्वां सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः॥", "tl": "Sarva-dharman parityajya mam ekam saranam vraja, aham tvam sarva-papebhyo moksayisyami ma sucah.", "english": "Abandon all varieties of religion and just surrender unto Me. I shall deliver you from all sinful reaction. Do not fear."}];
const CHAPTERS_LIST = [{"num": 1, "title": "Arjun Vishad Yog", "subtitle": "Lamenting the Consequences of War"}, {"num": 2, "title": "Sankhya Yog", "subtitle": "The Yog of Analytical Knowledge"}, {"num": 3, "title": "Karm Yog", "subtitle": "The Yog of Action"}, {"num": 4, "title": "Jnana Karm Sanyas Yog", "subtitle": "The Yog of Knowledge and the Disciplines of Action"}, {"num": 5, "title": "Karm Sanyas Yog", "subtitle": "The Yog of Renunciation"}, {"num": 6, "title": "Dhyan Yog", "subtitle": "The Yog of Meditation"}, {"num": 7, "title": "Jnana Vijnana Yog", "subtitle": "The Yog of Analytical Knowledge"}, {"num": 8, "title": "Akshar Brahma Yog", "subtitle": "The Yog of the Eternal God"}, {"num": 9, "title": "Raja Vidya Yog", "subtitle": "The Yog through the King of Sciences"}, {"num": 10, "title": "Vibhuti Yog", "subtitle": "The Yog through Appreciating the Infinite Opulences of God"}, {"num": 11, "title": "Vishwarup Darshan Yog", "subtitle": "The Yog through Beholding the Cosmic Form of God"}, {"num": 12, "title": "Bhakti Yog", "subtitle": "The Yog of Devotion"}, {"num": 13, "title": "Kshetra Kshetrajna Vibhag Yog", "subtitle": "The Yog through Distinguishing the Field and the Knower of the Field"}, {"num": 14, "title": "Guna Traya Vibhag Yog", "subtitle": "The Yog through Understanding the Three Modes of Material Nature"}, {"num": 15, "title": "Purushottam Yog", "subtitle": "The Yog of the Supreme Divine Personality"}, {"num": 16, "title": "Daivasura Sampad Vibhag Yog", "subtitle": "The Yog through Understanding Divine and Demoniac Nature"}, {"num": 17, "title": "Shraddhatraya Vibhag Yog", "subtitle": "The Yog through Understanding the Three Types of Faith"}, {"num": 18, "title": "Moksha Sanyas Yog", "subtitle": "The Yog through the Perfection of Renunciation and Surrender"}];
let cur = 0;
let curSanskritText = '';
let curEnglishText  = '';
let curTranslit     = '';

function openBook(){
  document.getElementById('coverScreen').classList.add('hide');
  document.getElementById('bookScreen').classList.add('show');
  setTimeout(()=>document.getElementById('coverScreen').style.display='none',800);
  renderPage(0);
}
function closeBook(){
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('coverScreen').style.display='flex';
  document.getElementById('coverScreen').style.opacity='0';
  document.getElementById('bookScreen').classList.remove('show');
  setTimeout(()=>{
    document.getElementById('coverScreen').classList.remove('hide');
    document.getElementById('coverScreen').style.opacity='';
    document.getElementById('coverScreen').style.display='';
  },50);
}
function prevPage(){ if(cur>0){cur--;renderPage(cur);} }
function nextPage(){ if(cur<PAGES.length-1){cur++;renderPage(cur);} }

document.addEventListener('keydown',e=>{
  if(!document.getElementById('bookScreen').classList.contains('show')) return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown') nextPage();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') prevPage();
});

function renderPage(n){
  const pg = PAGES[n];
  const L  = document.getElementById('leftContent');
  const R  = document.getElementById('rightContent');
  const ob = document.getElementById('openBook');

  ob.classList.remove('pg-flip');
  void ob.offsetWidth;
  ob.classList.add('pg-flip');

  curSanskritText=''; curEnglishText=''; curTranslit='';
  setVoiceBtns(false);

  if(pg.type==='cover'){
    renderIndexSpread(L,R);
  } else if(pg.type==='index'){
    renderIndexSpread(L,R);
  } else if(pg.type==='chapter'){
    renderChapterSpread(L,R,pg);
  } else if(pg.type==='verse'){
    renderVerseSpread(L,R,pg);
  }

  updateNav(pg,n);
}

function renderIndexSpread(L,R){
  const half1 = CHAPTERS_LIST.slice(0,9);
  const half2 = CHAPTERS_LIST.slice(9);
  L.innerHTML=`
    <div class="pg-header">
      <div class="pg-header-icon">✦ ✦ ✦</div>
      <div class="pg-chapter-label">Chapters</div>
    </div>
    <div class="pg-body">
      <div class="index-page">
        ${half1.map(c=>`
          <div class="index-item" onclick="jumpChapter(${c.num})">
            <div class="idx-num">Ch. ${c.num}</div>
            <div class="idx-title">${c.title}</div>
            <div class="idx-sub">${c.subtitle}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  R.innerHTML=`
    <div class="pg-header">
      <div class="pg-header-icon">✦ ✦ ✦</div>
      <div class="pg-chapter-label">Chapters</div>
    </div>
    <div class="pg-body">
      <div class="index-page">
        ${half2.map(c=>`
          <div class="index-item" onclick="jumpChapter(${c.num})">
            <div class="idx-num">Ch. ${c.num}</div>
            <div class="idx-title">${c.title}</div>
            <div class="idx-sub">${c.subtitle}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderChapterSpread(L,R,pg){
  const titleHTML=`
    <div class="ch-title-page">
      <div class="ctp-num">${pg.num}</div>
      <div class="ctp-tag">Chapter ${pg.num} &nbsp;·&nbsp; Adhyaya</div>
      <div class="ctp-divider"></div>
      <div class="ctp-title">${pg.title}</div>
      <div class="ctp-subtitle">${pg.subtitle}</div>
    </div>`;
  L.innerHTML=titleHTML;
  R.innerHTML=titleHTML;
}

function renderVerseSpread(L,R,pg){
  curSanskritText = pg.sanskrit;
  curEnglishText  = pg.english;
  curTranslit     = pg.tl;
  setVoiceBtns(true);

  L.innerHTML=`
    <div class="pg-header">
      <div class="pg-header-icon">✦</div>
      <div class="pg-chapter-label">अध्याय ${pg.chnum}</div>
      <div class="pg-verse-label">(${pg.chtitle})</div>
    </div>
    <div class="pg-body">
      <div class="pg-section-label" style="text-align:center">श्लोक ${pg.chnum}.${pg.vnum}</div>
      <div class="pg-sanskrit">${pg.sanskrit.replace(/\n/g,'<br>')}</div>
      <div class="pg-translit">${pg.tl}</div>
    </div>`;

  R.innerHTML=`
    <div class="pg-header">
      <div class="pg-header-icon">✦</div>
      <div class="pg-chapter-label">Chapter ${pg.chnum}</div>
      <div class="pg-verse-label">Verse ${pg.chnum}.${pg.vnum}</div>
    </div>
    <div class="pg-body">
      <div class="pg-meaning-label">— अर्थ —</div>
      <div class="pg-english">"${pg.english}"</div>
    </div>`;
}

function jumpChapter(n){
  const idx=PAGES.findIndex(p=>p.type==='chapter'&&p.num===n);
  if(idx>=0){cur=idx;renderPage(cur);}
}

function updateNav(pg,n){
  document.getElementById('arrowLeft').disabled=(n<=0);
  document.getElementById('arrowRight').disabled=(n>=PAGES.length-1);
  document.getElementById('prevBtn').disabled=(n<=0);
  document.getElementById('nextBtn').disabled=(n>=PAGES.length-1);

  let label='';
  if(pg.type==='cover'||pg.type==='index') label='Contents';
  else if(pg.type==='chapter') label=`Chapter ${pg.num}`;
  else label=`Ch.${pg.chnum} · Verse ${pg.vnum}`;

  document.getElementById('tbInfo').textContent=`${label}  ·  ${n+1} / ${PAGES.length}`;
  document.getElementById('bbCenter').innerHTML=`${label}<br><span style="font-size:.58rem;opacity:.65">Page ${n+1} / ${PAGES.length}</span>`;
}

function setVoiceBtns(on){
  document.getElementById('btnSanskrit').disabled=!on;
  document.getElementById('btnEnglish').disabled=!on;
  if(!on){
    document.getElementById('btnSanskrit').textContent='🕉 Sanskrit';
    document.getElementById('btnEnglish').textContent='🔊 English';
  }
}

// ========= SPEECH =========
function speakSanskrit(){
  if(!window.speechSynthesis){showToast('Speech not supported');return;}
  window.speechSynthesis.cancel();
  if(!curTranslit){showToast('No verse loaded');return;}
  const u=new SpeechSynthesisUtterance(curTranslit);
  u.lang='en-US'; u.rate=0.58; u.pitch=0.78;
  // Prefer a deep/calm English voice
  const voices=window.speechSynthesis.getVoices();
  const v = voices.find(v=>v.name.toLowerCase().includes('david'))
          ||voices.find(v=>v.name.toLowerCase().includes('george'))
          ||voices.find(v=>v.lang==='en-GB')
          ||voices.find(v=>v.lang.startsWith('en'));
  if(v) u.voice=v;
  const btn=document.getElementById('btnSanskrit');
  btn.innerHTML='🕉 Speaking<span class="sdot"></span>';
  u.onend=u.onerror=()=>{btn.textContent='🕉 Sanskrit';};
  window.speechSynthesis.speak(u);
  showToast('🕉 Reading Sanskrit transliteration...');
}



// REPLACE WITH:
function speakEnglish(){
  if(!window.speechSynthesis){showToast('Speech not supported');return;}
  window.speechSynthesis.cancel();
  if(!curEnglishText){showToast('No verse loaded');return;}

  const u = new SpeechSynthesisUtterance(curEnglishText);
  u.lang  = 'en-US';   // ← fixed: en-US always available
  u.rate  = 0.82;
  u.pitch = 0.95;

  function doSpeak(){
    const voices = window.speechSynthesis.getVoices();
    // ← fixed: each condition is separate, no broken &&
    const v = voices.find(v => v.lang === 'en-US')
           || voices.find(v => v.lang === 'en-GB')
           || voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'))
           || voices.find(v => v.lang.startsWith('en'))
           || voices.find(v => v.default);
    if(v) u.voice = v;

    const btn = document.getElementById('btnEnglish');
    btn.innerHTML = '🔊 Speaking<span class="sdot"></span>';
    u.onend = u.onerror = () => { btn.textContent = '🔊 English'; };
    window.speechSynthesis.speak(u);
    showToast('🔊 Reading English translation...');
  }

  // voices load async on first call — wait if empty
  if(window.speechSynthesis.getVoices().length > 0){
    doSpeak();
  } else {
    window.speechSynthesis.onvoiceschanged = doSpeak;
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
